name: publish

permissions:
  contents: read

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  deploy:
    if: >-
      ${{
        (github.event_name == 'release' &&
          !startsWith(github.event.release.tag_name, 'daily-') &&
          !startsWith(github.event.release.tag_name, 'agent-plugin-')) ||
        (github.event_name == 'workflow_dispatch' &&
          !startsWith(github.ref_name, 'daily-') &&
          !startsWith(github.ref_name, 'agent-plugin-'))
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-extension-${{ github.event.release.tag_name || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Check release metadata and credentials
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          VSIX_PATH="$(node scripts/check-extension-release.mjs)"
          echo "vsix_path=$VSIX_PATH" >> "$GITHUB_OUTPUT"

      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Check release source
        run: |
          pnpm run format
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run audit

      - name: Package VSIX
        run: |
          pnpm run package
          test -s "${{ steps.release.outputs.vsix_path }}"

      - name: Publish to Open VSX
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: pnpm exec ovsx -p "$OPEN_VSX_TOKEN" publish -i "${{ steps.release.outputs.vsix_path }}" --skip-duplicate

      - name: Publish to VS Marketplace
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: pnpm exec vsce publish --packagePath "${{ steps.release.outputs.vsix_path }}" --skip-duplicate -p "$VS_MARKETPLACE_TOKEN"
